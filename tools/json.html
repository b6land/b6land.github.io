<h1>JSON 格式化工具</h1>

<div id="dropZone">拖曳 JSON 檔案到這裡</div>

<textarea id="input" placeholder="請輸入 JSON..."></textarea>

<div class="buttons">
    <button onclick="formatJSON()">格式化</button>
    <button onclick="minifyJSON()">壓縮</button>
    <button onclick="clearText()">清除</button>
</div>

<div id="output" class="code-block" data-placeholder="結果會顯示在這裡..."></div>

<div id="error" class="error"></div>

<script>
    // ===== JSON 語法高亮 =====
    function syntaxHighlight(json) {
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;');

        return json.replace(
            /("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|\b\d+(\.\d+)?\b)/g,
            function (match) {
                let cls = 'number';

                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'key' : 'string';
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }

                return '<span class="' + cls + '">' + match + '</span>';
            }
        );
    }

    // ===== 格式化 =====
    function formatJSON() {
        const input = document.getElementById('input').value;
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = "";

        try {
            const obj = JSON.parse(input);
            const formatted = JSON.stringify(obj, null, 4);
            document.getElementById('output').innerHTML = 
                addLineNumbers(syntaxHighlight(formatted));
        } catch (e) {
            errorDiv.textContent = "JSON 格式錯誤：" + e.message;
        }
    }

    // ===== 壓縮 =====
    function minifyJSON() {
        const input = document.getElementById('input').value;
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = "";

        try {
            const obj = JSON.parse(input);
            const minified = JSON.stringify(obj);
            document.getElementById('output').textContent = minified;
        } catch (e) {
            errorDiv.textContent = "JSON 格式錯誤：" + e.message;
        }
    }

    // ===== 清除 =====
    function clearText() {
        document.getElementById('input').value = "";
        document.getElementById('output').innerHTML = "";
        document.getElementById('error').textContent = "";
    }

    // ===== 拖曳上傳 =====
    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');

        const file = e.dataTransfer.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('input').value = event.target.result;
        };
        reader.readAsText(file);
    });

    // ===== 顯示行號 =====
    function addLineNumbers(text) {
        return text.split("\n").map(line =>
            `<div class="code-line">${line}</div>`
        ).join("");
    }
</script>

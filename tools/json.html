<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }
    
    h1 {
        text-align: center;
    }
    
    textarea {
        width: 100%;
        height: 200px;
        margin-bottom: 10px;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
    }
    
    .buttons {
        text-align: center;
        margin-bottom: 10px;
    }
    
    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        background: #007bff;
        color: white;
        cursor: pointer;
        border-radius: 5px;
    }
    
    button:hover {
        background: #0056b3;
    }
    
    .error {
        color: red;
        text-align: center;
    }
</style>

<h1>JSON 格式化工具</h1>

<textarea id="input" placeholder="請輸入 JSON..."></textarea>

<div class="buttons">
    <button onclick="formatJSON()">格式化</button>
    <button onclick="minifyJSON()">壓縮</button>
    <button onclick="clearText()">清除</button>
</div>

<textarea id="output" placeholder="結果會顯示在這裡..." readonly></textarea>

<div id="error" class="error"></div>

<script>
    function formatJSON() {
        const input = document.getElementById('input').value;
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = "";

        try {
            const obj = JSON.parse(input);
            const formatted = JSON.stringify(obj, null, 4);
            document.getElementById('output').value = formatted;
        } catch (e) {
            errorDiv.textContent = "JSON 格式錯誤：" + e.message;
        }
    }

    function minifyJSON() {
        const input = document.getElementById('input').value;
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = "";

        try {
            const obj = JSON.parse(input);
            const minified = JSON.stringify(obj);
            document.getElementById('output').value = minified;
        } catch (e) {
            errorDiv.textContent = "JSON 格式錯誤：" + e.message;
        }
    }

    function clearText() {
        document.getElementById('input').value = "";
        document.getElementById('output').value = "";
        document.getElementById('error').textContent = "";
    }
</script>
